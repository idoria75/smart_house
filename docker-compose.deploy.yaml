version: '3.8'

services:
  backend:
    image: ghcr.io/<your-github-username>/smart-house-backend:latest
    container_name: backend-sh
    ports:
      - "3003:3001"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - MQTT_BROKER=mqtt://localhost:1885
      - DB_PASSWORD=yourpassword
      - DB_USER=webapp
      - DB_NAME=webapp
      - DB_HOST=mysql-sh
    networks:
      - server-network

  frontend:
    image: ghcr.io/<your-github-username>/smart-house-frontend:latest
    container_name: frontend-sh
    ports:
      - "3002:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:3003
    networks:
      - server-network

  mosquitto:
    container_name: mosquitto-sh
    image: eclipse-mosquitto:2.0.22
    ports:
      - "1885:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - server-network

  mysql:
    container_name: mysql-sh
    image: mysql:8.4.3
    restart: always
    ports:
      - 3308:3306
    volumes:
      - ./mysql/init-scripts:/docker-entrypoint-initdb.d
      - ./mysql/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_PASSWORD: yourpassword
      MYSQL_DATABASE: webapp
      MYSQL_USER: webapp
    networks:
      - server-network

  adminer:
    container_name: adminer-sh
    image: adminer
    restart: always
    ports:
      - 9092:8080
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - server-network

networks:
  server-network:
    driver: bridge
